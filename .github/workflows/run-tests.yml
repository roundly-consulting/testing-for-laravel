name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [12.*, 13.*]
        # Pest sits in this package's require, so both majors are supported surface. Without
        # this axis the L13 leg would silently move to Pest 5 and Pest 4 would lose L13.
        pest: [4.*, 5.*]
        stability: [prefer-stable]
        exclude:
          # Pest 5 needs PHPUnit 13 and symfony/process 8; Laravel 12 / Testbench 10 can't.
          - laravel: 12.*
            pest: 5.*
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - Pest ${{ matrix.pest }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, fileinfo
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          # --with narrows Testbench and Pest to the leg's majors for this resolve only:
          # composer.json keeps both in `require` (the dev-only carve-out) with their committed
          # constraints, which the suite itself pins. `require --dev` would move them.
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction \
            --with "orchestra/testbench:${{ matrix.testbench }}" \
            --with "pestphp/pest:${{ matrix.pest }}" \
            --with "pestphp/pest-plugin-laravel:${{ matrix.pest }}"

      - name: List Installed Dependencies
        run: composer show -D

      - name: Verify Pest major
        # A leg must never run the other major and still report green under its name.
        run: |
          installed="$(composer show pestphp/pest --format=json | jq -r '.versions[0]')"
          expected="${{ matrix.pest }}"
          echo "pestphp/pest ${installed} (leg: ${expected})"
          major="${installed#v}"
          if [ "${major%%.*}" != "${expected%%.*}" ]; then
            echo "::error::Pest ${installed} installed on the Pest ${expected} leg"
            exit 1
          fi

      - name: Execute tests
        run: vendor/bin/pest --coverage --min=90

  test-pgsql:
    runs-on: ubuntu-latest
    name: P8.4 - pgsql real-engine

    steps:
      # Started first so the engine boots while PHP and the dependencies install. The data
      # directory is tmpfs and durability is off: the same planner, isolation levels, locks and
      # limits — nothing this leg proves depends on surviving a power cut.
      - name: Start postgres
        run: >-
          docker run -d --name postgres --tmpfs /var/lib/postgresql/data
          -e POSTGRES_DB=testing -e POSTGRES_USER=testing -e POSTGRES_PASSWORD=secret
          -p 5432:5432 postgres:16
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, soap, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Show Pest version
        run: composer show pestphp/pest

      # The image's init server listens on the socket only, so a TCP answer means the real one is up.
      - name: Wait for postgres
        run: |
          for _ in $(seq 1 90); do
            docker exec postgres psql -h 127.0.0.1 -U testing -d testing -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Execute tests against postgres
        env:
          # TESTING_DB_DRIVER is what moves the suite off sqlite. The TESTING_DB_* location
          # vars alone only describe where the engine is: without the driver this job ran
          # every test on sqlite and called itself a postgres leg.
          TESTING_DB_DRIVER: pgsql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 5432
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg, and
        # re-measuring coverage doubles the slowest job for no signal.
        run: vendor/bin/pest --ci

      # The kept-schema tests leave their tables to the worker's shutdown drop, and every other
      # test drops its own: a table still here is a reset that leaked.
      - name: Prove the suite left the database empty
        run: |
          left="$(docker exec postgres psql -h 127.0.0.1 -U testing -d testing -tAc "select string_agg(schemaname || '.' || tablename, ', ') from pg_tables where schemaname not in ('pg_catalog', 'information_schema')")"
          if [ -n "$left" ]; then
            echo "::error::tables left behind: $left"
            exit 1
          fi
